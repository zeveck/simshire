<style>
  @font-face { font-family: 'Fredoka'; font-weight: 500; src: url('fonts/fredoka-latin-500-normal.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'Fredoka'; font-weight: 600; src: url('fonts/fredoka-latin-600-normal.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'IM Fell English SC'; font-weight: 400; src: url('fonts/im-fell-english-sc-latin-400-normal.woff2') format('woff2'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #e9d8b0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  body { position: fixed; inset: 0; }
  canvas { position: absolute; display: block; outline: none; -webkit-tap-highlight-color: transparent; }
  #safe { position: fixed; inset: 0; pointer-events: none; visibility: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #turn { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    background: #f4e6c4; color: #4a3426; font: 600 22px Fredoka, sans-serif; text-align: center; padding: 24px; z-index: 5; }
  #turn .phone { width: 44px; height: 76px; border: 5px solid #4a3426; border-radius: 10px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #4a3426; font: 600 22px Fredoka, sans-serif; }
</style>
</head>
<body>
<div id="safe"></div>
<div id="loading">Loading Sim Shire…</div>
<canvas id="game" tabindex="0" aria-label="Sim Shire game"></canvas>
<div id="turn"><div class="phone"></div><div>Turn your phone sideways to play Sim Shire</div></div>
<script type="module" src="src/main.js"></script>
<script>
  const local = ['localhost', '127.0.0.1'].includes(location.hostname);
  if ('serviceWorker' in navigator && (!local || new URLSearchParams(location.search).has('sw'))) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
